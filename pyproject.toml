[project]
name = "diskphot"
version = "1.0.0"
description = "Transit photometry of the HD 107146 debris disk: marginal-likelihood forward model and nested-sampling inference of the disk optical depth from a background galaxy seen through the disk with HST/STIS."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Lukas Welzel", email = "welzel@strw.leidenuniv.nl" }
]
requires-python = ">=3.12"
keywords = ["astronomy", "debris disk", "HD 107146", "HST", "nested sampling", "transit photometry"]
classifiers = [
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Astronomy",
]
dependencies = [
    "astropy>=8.0",
    "cmasher>=1.9",
    "h5py>=3.16",
    "matplotlib>=3.11",
    "numpy>=2.5",
    "pandas>=3.0",
    "scipy>=1.18",
    "torch>=2.13",
    "ultranest>=4.5",
]

[project.urls]
Repository = "https://github.com/lwelzel/diskphot"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.14",
]

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

# The production run of the paper used the CUDA 13.0 builds of torch
# (torch 2.13.0+cu130 from https://download.pytorch.org/whl/cu130).  The
# dependency above resolves to the default PyPI build; to pin a specific
# CUDA (or CPU-only) build with uv, uncomment and adapt:
#
# [tool.uv.sources]
# torch = { index = "pytorch-cu130", marker = "sys_platform == 'linux'" }
#
# [[tool.uv.index]]
# name = "pytorch-cu130"
# url = "https://download.pytorch.org/whl/cu130"
# explicit = true

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "NPY"]
# style-only rules not applied to the paper scripts: warning stacklevel,
# zip(strict=), printf-style formatting
ignore = ["B028", "B905", "UP031"]

[tool.pytest.ini_options]
testpaths = ["tests"]
