[project]
name = "diskphot"
version = "0.1.0"
description = "Debris-disk transit photometry of HD 107146: joint forward modelling and nested-sampling inference of the disk optical depth."
readme = "README.md"
authors = [
    { name = "Lukas Welzel", email = "welzel@strw.leidenuniv.nl" }
]
requires-python = ">=3.12"
dependencies = [
    "arviz>=1.3.0",
    "arxiv-latex-cleaner>=1.0.11",
    "astropy>=8.0.1",
    "cmasher>=1.9.2",
    "corner>=2.3.0",
    "emcee>=3.1.6",
    "h5py>=3.16.0",
    "kornia>=0.8.3",
    "matplotlib>=3.11.1",
    "numpy>=2.5.2",
    "pandas>=3.0.5",
    "pymupdf>=1.28.2",
    "reproject>=0.21.0",
    "scipy>=1.18.0",
    "seaborn>=0.13.2",
    "torch>=2.13.0",
    "torchvision>=0.28.0",
    "tqdm>=4.70.0",
    "ultranest>=4.5.0",
]

[project.scripts]
diskphot = "diskphot.cli:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[tool.hatch.build.targets.wheel]
packages = ["src/diskphot"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "NPY"]

[tool.uv.sources]
torch = { index = "pytorch-cu130" }
torchvision = { index = "pytorch-cu130" }

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true
