[project]
name = "diskphot"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Lukas Welzel", email = "welzel@strw.leidenuniv.nl" }
]
requires-python = ">=3.12"
dependencies = [
    "arviz>=1.3.0",
    "astropy>=8.0.1",
    "cmasher>=1.9.2",
    "corner>=2.3.0",
    "matplotlib>=3.11.1",
    "numpy>=2.5.2",
    "pandas>=3.0.5",
    "scipy>=1.18.0",
    "seaborn>=0.13.2",
    "tqdm>=4.70.0",
    "ultranest>=4.5.0",
]

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"
